name: Numa
description: 'Numa is the AI Operating System for car dealerships. Its voice AI and messaging
  platform answers dealership calls and texts, connects directly to the DMS (CDK, Tekion,
  Reynolds & Reynolds) with roughly 90% DMS coverage, books service appointments, and
  coordinates the service lane and fixed operations. Used by over 1,300 dealerships, Numa
  reports cutting average customer response time from 23 hours to under 10 minutes and
  lifting repair-order dollars per advisor. Numa publishes no public API or developer
  portal; integrations are delivered through native DMS, CRM, and scheduler connectors.'
